name: Supabase functions

on:
  push:
    branches: [main]
    paths: ["supabase/**", "schemas/**", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**", "schemas/**", ".github/workflows/supabase.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - name: fmt, lint, type-check, tests (incl. JSON Schema drift)
        run: deno task ci
