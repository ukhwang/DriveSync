name: Domain logic (Kotlin/JVM)

on:
  push:
    branches: [main]
    paths: ["android/**", "design/tokens.json", ".github/workflows/domain.yml"]
  pull_request:
    paths: ["android/**", "design/tokens.json", ".github/workflows/domain.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Safety policy, session state machine, action engine, AI contracts
        run: ./gradlew -Pdomain.only=true test --no-daemon
