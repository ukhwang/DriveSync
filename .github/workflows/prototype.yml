name: Web prototype

on:
  push:
    branches: [main]
    paths: ["prototype/**", ".github/workflows/prototype.yml"]
  pull_request:
    paths: ["prototype/**", ".github/workflows/prototype.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - name: Type check, proposal compliance tests, production build
        run: npm run ci
